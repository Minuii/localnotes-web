<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LocalNotes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalNotes</title>
<link rel="stylesheet" href="./lib/katex/dist/katex.min.css">
<script defer src="./lib/katex/dist/katex.min.js" onload="renderAllMath()"></script>
<script src="./lib/marked/lib/marked.umd.js"></script>
<script src="./lib/jszip/dist/jszip.min.js"></script>
<style>
:root{--s0:#111;--s1:#1b1b1b;--s2:#232323;--s3:#2b2b2b;--s4:#333;--s5:#3a3a3a;--s6:#555;--t4:#777;--t5:#8a8a8a;--mut:#9a9a9a;--t3:#bbb;--t2:#d0d0d0;--tx:#e9e9e9;--t1:#fff;--acc:#00a82d;--acc-h:#00b832;--acc2:#2dbe60;--bg:var(--s1);--rail:var(--s0);--panel:var(--s2);--panel2:var(--s3);--line:var(--s4);--sel:var(--s3)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--rail);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
body{display:flex;overflow:hidden}
a{color:inherit}
h1{margin:0 0 4px;font-size:26px}h3{margin:0 0 10px;font-size:15px}
h3 a{text-decoration:none}
button,.btn{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--s6)}
.pri{background:var(--acc);border-color:var(--acc);color:var(--t1)}
input,select,textarea{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
input:focus,select:focus,textarea:focus{outline:1px solid var(--t5);border-color:var(--t5)}
.mut{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
small{color:var(--mut);font-size:11px}
svg{flex:none}

/* rail / sidebar (Evernote style) */
#side{width:240px;flex:none;display:flex;flex-direction:column;gap:2px;padding:10px 8px;overflow:auto;transition:width .15s}
.top{display:flex;gap:8px;justify-content:space-between;margin-bottom:6px}
.ib{width:40px;height:40px;border-radius:50%;padding:0;justify-content:center;background:var(--s2);border:none;color:var(--t3)}
.ib:hover{background:var(--s3);color:var(--t1)}
.newbtn{background:var(--acc);border:none;color:var(--t1);border-radius:24px;padding:10px 16px;margin:6px 0 14px;justify-content:flex-start;gap:10px;font-weight:600}
.newbtn:hover{background:var(--acc-h)}
.nav{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:8px;color:var(--t2);text-decoration:none;white-space:nowrap;overflow:hidden;cursor:pointer}
.nav:hover{background:var(--s1);color:var(--t1)}.nav.on{background:var(--s2);color:var(--t1)}
.nav .lbl{overflow:hidden;text-overflow:ellipsis}
.nav small{margin-left:auto}
.sh{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 4px 10px}
.sh button{padding:2px;border:none;background:none;color:var(--mut)}
.sh button:hover{color:var(--t1)}
body.collapsed #side{width:64px;align-items:center}
body.collapsed .lbl,body.collapsed .sh,body.collapsed .nbitem{display:none}
body.collapsed .top{flex-direction:column}
body.collapsed .nav{padding:9px;justify-content:center}
body.collapsed .newbtn{width:48px;height:48px;border-radius:50%;padding:0;justify-content:center}
.sep2{height:1px;background:var(--s2);margin:10px 6px;align-self:stretch}
main{flex:1;min-width:0;overflow:auto;background:var(--bg);margin:8px 8px 8px 0;border:1px solid var(--s3);border-radius:14px}
.page{max-width:980px;margin:0 auto;padding:28px}

/* notes */
.split{display:flex;height:100%}
.list{width:310px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column}
.list header{padding:18px 14px 10px;display:grid;gap:8px}
.list h2{margin:0;font-size:20px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.items{overflow:auto;flex:1}
.item{padding:12px 14px;border-bottom:1px solid var(--s3);cursor:pointer}
.item:hover{background:var(--s1)}.item.on{background:var(--sel);box-shadow:inset 3px 0 var(--t3)}
.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item p{margin:2px 0;color:var(--mut);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.editor{flex:1;min-width:0;display:flex;flex-direction:column}
.etop{padding:12px 28px 0;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:12px}
.title{font-size:30px;font-weight:700;background:none;border:none;padding:8px 28px;width:100%}
.title:focus{outline:none}
.tb{display:flex;flex-wrap:wrap;gap:2px;padding:4px 24px 6px;border-bottom:1px solid var(--line)}
.tb button{padding:3px 8px;min-width:32px;background:none;border-color:transparent;color:var(--t2);justify-content:center}
.tb button:hover{background:var(--panel2);color:var(--t1)}
.tb .vs{width:1px;background:var(--line);margin:4px 4px}
.fview .etop{padding:12px 24px}
.fview .tb{padding:4px 16px 6px;align-items:center}
.tb>.inkbar:first-child{margin-left:8px;padding-left:0;border-left:0}
/* note editor toolbar */
.etb{flex-wrap:nowrap;align-items:center;padding:6px 28px;overflow-x:auto;scrollbar-width:none}
.etb::-webkit-scrollbar{display:none}
.etb .ti{width:32px;height:32px;min-width:0;padding:0;flex:none;justify-content:center;border:1px solid transparent;border-radius:7px;color:var(--t3);font-size:15px}
.etb .ti:hover{background:var(--s3);color:var(--t1)}
.etb .ti.on{background:var(--s4);border-color:var(--s5);color:var(--t1)}
.etb .tmenu{width:auto;padding:0 6px;gap:1px}
.etb .tdraw{width:auto;padding:0 11px;gap:7px;border-color:var(--s4);font-size:13px}
.etb .tstyle{height:32px;min-width:132px;padding:0 8px 0 11px;flex:none;justify-content:space-between;gap:8px;border:1px solid var(--s5);border-radius:7px;color:var(--tx);font-size:13px}
.etb .tstyle:hover{border-color:var(--s6);background:none}
.etb .tx{font-family:"Cambria Math","Times New Roman",serif;font-size:17px;font-style:italic}
.etb .vs{height:20px;margin:0 7px;flex:none}
.inkrow{display:flex;align-items:center;padding:6px 28px;border-bottom:1px solid var(--line);background:var(--s1)}
.inkrow[hidden]{display:none}
.inkrow .inkbar{margin-left:0;padding-left:0;border-left:0}
.ctx button{gap:10px;align-items:center;text-align:left}
.etop .tdraw{padding:3px 10px;font-size:12px;background:none}
.etop .tdraw.on{background:var(--s4);border-color:var(--mut);color:var(--t1)}
.ctx kbd{font-size:11px;padding:0 5px}
.bodywrap{flex:1;overflow:auto;overflow-x:hidden;position:relative}
.body{min-height:100%;padding:18px 28px 120px;outline:none;font-size:15px;line-height:1.7}
canvas.ink{position:absolute;top:0;left:0;pointer-events:none;z-index:2}
body[data-ink="draw"] .inkhost{cursor:crosshair}
.inkbar{display:inline-flex;gap:3px;align-items:center;margin-left:auto;padding-left:8px;border-left:1px solid var(--line);flex-wrap:wrap}
.inkbar select{padding:2px 4px;font-size:12px}
.inkbar button{height:28px;min-width:28px;padding:0 7px;font-size:12px;justify-content:center;border-radius:7px;background:none;border:1px solid transparent;color:var(--t3)}
.inkbar button:hover{background:var(--s3);color:var(--t1)}
.inkbar select{height:28px;border-radius:7px}
.inkbar .on:not(.sw){background:var(--s5)!important;border-color:var(--t2)!important;color:var(--t1)!important}
.inkbar .sw{width:18px;height:18px;min-width:0;padding:0;border-radius:50%;border:2px solid var(--s6)}
.inkbar .sw.on{outline:2px solid var(--t1);outline-offset:1px}
.inkbar input[type=range]{width:64px}
.body h1,.body h2,.body h3{line-height:1.3}
.body pre,.md pre{background:var(--s0);padding:10px 12px;border-radius:8px;white-space:pre-wrap;font-family:Consolas,monospace}
.body blockquote,.md blockquote{border-left:3px solid var(--acc);margin:0;padding-left:12px;color:var(--t2)}
.body a,.md a{color:#6cb6ff}

.math{cursor:pointer;border-radius:4px;padding:0 2px}
.math:hover{background:var(--s3)}
.math[data-display="1"]{display:block;text-align:center;margin:10px 0}
.empty{color:var(--mut);display:grid;place-items:center;height:100%;text-align:center}

/* home */
.home{padding:28px 56px 28px 32px;max-width:1420px;margin:0 auto}
.hcols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start;margin-top:22px}
.hcol{display:flex;flex-direction:column;gap:20px;min-height:160px}
.hcols .cards{margin:0}
.hcols .wh{height:32px;margin:0;gap:6px}
.wb{margin-top:10px}
.grip{cursor:grab;color:var(--s6);font-size:16px;padding:0 2px;user-select:none;line-height:1}
.grip:hover{color:var(--t1)}.grip:active{cursor:grabbing}
.fold{background:none;border:none;padding:2px;color:var(--mut);transition:transform .15s}
.fold:hover{color:var(--t1)}
.widget.shut .fold{transform:rotate(-90deg)}
.widget.shut .wb{display:none}
.widget.dragging{opacity:.3}
.wph{border:2px dashed var(--t4);border-radius:12px;background:#ffffff06}
.sz-compact .wb{max-height:230px;overflow:auto;border-radius:12px}
.sz-tall .wb>.box,.sz-tall .wb>.cards,.sz-tall .wb>.strip{min-height:480px}
.sz-tall .scratch textarea{height:460px}
.frow{display:flex;gap:8px;align-items:center;padding:6px 4px;border-radius:6px;text-decoration:none}
.frow:hover{background:var(--panel2)}
.frow .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:12px;overflow-x:auto;padding-bottom:4px}
.strip .card{height:150px}.strip .bcard img,.strip .bcard .blank{height:90px}
.pinbody{padding:0!important;min-height:80px;max-height:420px;overflow:auto}
.fc .fq{font-size:17px;font-weight:600;margin-bottom:8px}
.fc .fa{padding:10px 12px;background:var(--panel2);border-radius:8px;margin-bottom:10px}
.ft{font-size:40px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1;min-width:120px}
.fbarw{height:6px;background:var(--panel2);border-radius:3px;margin-top:6px;overflow:hidden}
.fbar{height:100%;background:var(--t2);transition:width 1s linear}
.hab{width:100%;border-collapse:collapse;font-size:13px}
.hab th{font-weight:500;color:var(--mut);font-size:11px}
.hab td,.hab th{text-align:center;padding:3px}.hab td:first-child{text-align:left}

.hab .x,.frm .x{background:none;border:none;color:var(--mut);padding:0 4px}
.frm{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:8px;cursor:pointer;margin-bottom:4px;background:var(--panel2)}
.frm:hover{outline:1px solid var(--line)}.frm.copied{outline:1px solid var(--t2)}
.frm.copied::after{content:'Copied';color:var(--t2);font-size:11px}
.inkpad{position:relative;height:220px;background:var(--s1)}
.brief{white-space:pre-wrap;line-height:1.6}
.wtab{width:100%;border-collapse:collapse}.wtab td{padding:6px 4px;border-bottom:1px solid var(--line)}
.wtab select{padding:3px 6px;width:100%}
.hcal{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;align-items:start}
.hcal .mini{margin:6px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;height:170px;display:flex;flex-direction:column;gap:4px;text-decoration:none;overflow:hidden;text-align:left;align-items:stretch}
.card:hover{border-color:var(--s6)}
.card p{margin:0;color:var(--mut);font-size:12px;flex:1;overflow:hidden}
.newc{align-items:center;justify-content:center;font-size:15px;text-align:center;gap:10px}
.newc .dot{width:44px;height:44px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:var(--t1)}
.scratch{padding:0;background:none;border:none}
.scratch textarea{width:100%;height:260px;resize:vertical;background:#3a3618;border-color:#4a4520;border-radius:12px;padding:12px;line-height:1.6;display:block}
.wh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wh h3{margin:0;flex:1}

/* tasks */
.task{display:flex;gap:8px;align-items:center;padding:3px 0}
.task .tt{flex:1;min-width:0;background:none;border-color:transparent}
.task .tt:hover{border-color:var(--line)}
.task.done .tt{text-decoration:line-through;color:var(--mut)}

.task .x{background:none;border:none;color:var(--mut);padding:0 6px}
.task .td{width:135px;padding:3px 6px}
.hcols .task .td{width:118px;font-size:12px}
.over .td{color:#ff7b7b}
.tgroup{margin:18px 0 4px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line);margin-top:14px}
.cal>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:112px;padding:4px;cursor:pointer;overflow:hidden;min-width:0}
.cal>div:hover{background:var(--s1)}
.cal .dow{min-height:0;text-align:center;color:var(--mut);font-size:12px;cursor:default}
.cal .out{opacity:.4}
.dn{display:inline-block;width:24px;height:24px;text-align:center;line-height:24px;font-size:12px;border-radius:50%}
.td .dn{background:var(--acc);color:var(--t1)}
.ev{font-size:12px;background:var(--s2);border-left:2px solid var(--t5);border-radius:4px;padding:1px 6px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.task{background:var(--s2);border-left-style:dotted}.ev.done{text-decoration:line-through;opacity:.6}
.mini{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;gap:2px;margin:8px 0 12px}
.mini span{padding:5px 0;border-radius:6px;cursor:pointer;position:relative}
.mini span:hover{background:var(--panel2)}
.mini .h{color:var(--mut);cursor:default}.mini .out{opacity:.35}.mini .tdy{color:var(--acc2);font-weight:700}
.mini .sel{background:var(--acc);color:var(--t1)}
.mini .has::after{content:'';position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--t3)}
.calrow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.cdot{width:12px;height:12px;border-radius:50%;flex:none}

/* files */
.drop{outline:2px dashed var(--t5);outline-offset:-8px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:0 8px;border-radius:10px;background:none;color:var(--t3);border:1px solid var(--s5);cursor:pointer}
.tag.on{border-color:var(--tx);color:var(--t1)}
.fview{flex:1;min-width:0;display:flex;flex-direction:column}
.fview iframe{flex:1;border:none;background:#fff}
.md{flex:1;overflow:auto;overflow-x:hidden;padding:20px 24px 80px;font-size:15px;line-height:1.7;position:relative}
.md>*:not(canvas){max-width:860px}

.deck{flex:1;overflow:auto;padding:24px 24px 24px 48px;background:var(--s3)}
.slidewrap{position:relative;margin:0 auto 28px;box-shadow:0 2px 14px #0009}
.pdfc{display:block;background:#fff}
.slidewrap.act{outline:2px solid #9a9a9a;outline-offset:3px}
.slidewrap .num{position:absolute;left:-30px;top:0;color:var(--mut);font-size:12px}
.slide{position:relative;overflow:hidden;color:#111;font-family:Calibri,Carlito,"Segoe UI",sans-serif}
.shp{position:absolute;overflow:hidden}
.shp img{width:100%;height:100%;display:block}
.shp.act{outline:2px dashed var(--t5);outline-offset:1px}
.pp{white-space:pre-wrap;line-height:1.15;outline:none;min-height:1em;padding:0 .4em}
.pp:focus{background:#0000000a}
/* view headers: icon chip + title/subtitle + grouped controls */
.vhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hico{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;color:var(--tx);background:linear-gradient(145deg,var(--s3),var(--s2));border:1px solid var(--s5);box-shadow:inset 0 1px 0 #ffffff10}
.htitle{display:flex;flex-direction:column;min-width:0}
.htitle h1{margin:0;line-height:1.15}
.htitle small{font-size:12px;color:var(--mut);margin-top:2px}
.ibtn{gap:7px;height:36px;padding:0 13px;border-radius:9px;background:var(--panel2);border-color:var(--s5);color:var(--tx);transition:background .12s,border-color .12s}
.ibtn:hover{background:var(--s4);border-color:var(--s6);color:var(--t1)}
.ibtn.sq{width:36px;padding:0;justify-content:center}
.ibtn.pri{background:var(--acc);border-color:var(--acc);color:var(--t1)}
.ibtn.pri:hover{background:var(--acc-h)}
.ibtn.danger:hover{background:#3a2020;border-color:#7a3a3a;color:#ff9a9a}
.seg{display:inline-flex;height:36px;border:1px solid var(--s5);border-radius:9px;overflow:hidden;background:var(--panel2);flex:none}
.seg button{height:100%;border:none;border-radius:0;background:none;padding:0 11px;color:var(--t2);justify-content:center;min-width:36px}
.seg button+button{border-left:1px solid var(--s5)}
.seg button:hover{background:var(--s4);color:var(--t1)}
.seg button.on{background:var(--s5);color:var(--t1);box-shadow:inset 0 -2px 0 var(--t2)}
.lockform{display:grid;gap:10px;justify-items:center;width:300px;text-align:center}
.lockform input{width:100%}
.lockform h3{margin:4px 0 0}
.lockmsg{padding:24px 14px;text-align:center;color:var(--mut)}
/* infinite whiteboard */
.wb{display:flex;flex-direction:column;height:100%}
.wb-top{gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--s1),var(--s1))}
.wb-top .hico{width:36px;height:36px;border-radius:10px}
.wb-top #bn{width:260px;background:none;border-color:transparent;font-weight:700;font-size:16px;padding:2px 6px;margin-left:-6px}
.wb-top #bn:hover,.wb-top #bn:focus{border-color:var(--line)}
.wb-stage{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:crosshair;border-radius:0 0 14px 14px}
.wb-stage[data-tool=select]{cursor:default}.wb-stage[data-tool=text]{cursor:text}.wb-stage[data-tool=note]{cursor:copy}
.wb-stage.panready,.wb-stage.panning{cursor:grab}
#wbc,#wbl{position:absolute;inset:0;width:100%;height:100%}
#wbl{pointer-events:none}
.wb-objs{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;pointer-events:none}
.wb-stage.objmode .wbo{pointer-events:auto;cursor:move}
.wbo{position:absolute;user-select:none}
.wbo.on{outline:1.5px solid var(--t5);outline-offset:2px}
.wb-note{box-shadow:0 3px 10px #0003;border-radius:3px}
.wb-note .wbt{padding:14px;height:100%;overflow:hidden;font:18px/1.35 "Segoe UI",sans-serif;color:#2b2400;white-space:pre-wrap;overflow-wrap:break-word;outline:none}
.wb-text .wbt{white-space:pre-wrap;overflow-wrap:break-word;line-height:1.3;min-height:1.3em;outline:none;font-family:"Segoe UI",sans-serif}
.wbt[contenteditable=true]{cursor:text;user-select:text;outline:1px dashed #8888;outline-offset:3px}
.wb-img img{width:100%;height:100%;display:block;pointer-events:none}
.wb-selbox{position:absolute;border:1.5px dashed var(--t5);border-radius:4px;cursor:move;z-index:4}
.wb-h{position:absolute;right:-7px;bottom:-7px;width:12px;height:12px;background:#fff;border:1.5px solid #666;border-radius:3px;cursor:nwse-resize}
.wb-selbar{position:absolute;left:0;top:-48px;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px;box-shadow:0 4px 14px #0007;white-space:nowrap;cursor:default}
.wb-selbar button{padding:3px 8px;font-size:12px;background:none;border-color:transparent}
.wb-selbar .sw{width:16px;height:16px;padding:0;border-radius:50%;border:1px solid #0005}

/* monochrome outline checkboxes everywhere (checkmark is absolutely placed so ticking never shifts the line) */
input[type=checkbox]{appearance:none;width:16px;height:16px;flex:none;border:1.5px solid var(--t5);border-radius:4px;display:inline-block;position:relative;vertical-align:-3px;margin:0 6px 0 0;cursor:pointer;background:transparent;outline:none}

input[type=checkbox]:checked::after{content:'';position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid var(--s1);border-width:0 2px 2px 0;transform:rotate(45deg)}
input[type=checkbox]:focus-visible{box-shadow:0 0 0 2px #ffffff33}

.ctxbar{display:flex;align-items:center;gap:1px;padding:3px;flex-wrap:nowrap}
.ctx .ctxbar button{width:30px;height:30px;padding:0;justify-content:center;flex:none;color:#ddd}
.ctx .ctxbar .vs{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.hlsw{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid #0003;flex:none}
.body img{max-width:100%;cursor:pointer;border-radius:8px}
.body img.nimg{display:block;margin:10px 0}
.body img.sel{outline:2px solid #9a9a9a;outline-offset:3px}
.imgbar{position:absolute;z-index:6;display:flex;gap:2px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 6px 18px #0008}
.imgbar[hidden]{display:none}

dialog.wide{width:fit-content;max-width:96vw}
.anno .sw{width:20px;height:20px;padding:0;border-radius:50%;border:2px solid #555}.anno .sw.on{outline:2px solid #fff;outline-offset:1px}

.ctx button:hover{background:var(--panel2)}

.secitem{padding-left:36px!important;font-size:13px}

/* index */

/* paper styles & page colours */
.body{--rule:var(--s4);--lh:28px}

.body.pc-blue{background-color:#e9f2fc;color:#18212e;--rule:#b6cbe6}
.body.pc-green{background-color:#e9f6ec;color:#17261b;--rule:#b2d8bb}

.body:is(.paper-college,.paper-wide,.paper-narrow){line-height:var(--lh);padding-top:20px;background-image:linear-gradient(transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px));background-size:100% var(--lh);background-position:0 20px}

.body.paper-grid-l{background-size:40px 40px}

/* shortcuts panel */
#kbd{position:fixed;top:8px;right:8px;bottom:8px;width:400px;background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:15;display:flex;flex-direction:column;box-shadow:-10px 0 40px #000a;animation:slidein .18s ease-out}

kbd{font:12px Consolas,monospace;background:var(--s0);border:1px solid var(--s5);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap;color:var(--tx)}

#kbdTab:hover{color:var(--t1);background:var(--panel2)}
.toast.upd{bottom:72px;display:flex;gap:10px;align-items:center}

.pp:empty::before{content:'Click to add text';color:var(--mut)}
/* sticky notes on slides */
.stk-layer{position:absolute;inset:0;pointer-events:none;z-index:3}

/* ---------- resizable / foldable columns: <div data-rz="key:min:max"> gets a drag divider after it ---------- */
function addResizers(root) {
  root.querySelectorAll('[data-rz]').forEach(pane => {
    const [key, min, max] = pane.dataset.rz.split(':'), W = S.settings.widths ||= {}, st = W[key] ||= {};
    if (st.w) pane.style.width = st.w + 'px';
    pane.classList.toggle('folded', !!st.folded);
    const h = Object.assign(document.createElement('div'), { className: 'rz', title: 'Drag to resize · double-click to fold' }); pane.after(h);
    const fold = f => { st.folded = f; pane.classList.toggle('folded', f); save(); };
    h.ondblclick = () => fold(!st.folded);
    pane.addEventListener('click', e => { if (st.folded) { e.stopPropagation(); fold(false); } }, true);
    h.onpointerdown = e => {
      e.preventDefault(); try { h.setPointerCapture(e.pointerId); } catch { } h.classList.add('drag'); document.body.style.userSelect = 'none';
      const x0 = e.clientX, w0 = st.folded ? 0 : pane.offsetWidth;

        else { pane.classList.remove('folded'); st.folded = false; st.w = Math.max(+min, Math.min(+max, w)); pane.style.width = st.w + 'px'; }
      };
      h.onpointerup = () => { h.onpointermove = h.onpointerup = null; h.classList.remove('drag'); document.body.style.userSelect = ''; save(); };
    };
  });
}

function autoMath() { // runs when "$" is typed: converts $..$ / $$..$$ ending at the caret
  const s = getSelection(), node = s.anchorNode;

  else if ((m = before.match(/(^|[^$\\])\$([^$\s](?:[^$]*[^$\s])?)\$$/))) { start = before.length - m[0].length + m[1].length; tex = m[2]; display = false; }

/* ---------- calendar subscriptions (.ics) ---------- */
function icsDate(v, params = []) {
  const y = +v.slice(0, 4), m = +v.slice(4, 6) - 1, d = +v.slice(6, 8);
  if (params.includes('VALUE=DATE') || v.length === 8) return { d: new Date(y, m, d), allDay: true };
  const H = +v.slice(9, 11), M = +v.slice(11, 13), s = +v.slice(13, 15);
  // ponytail: TZID times are read as this computer's local time; exact when the calendar uses your timezone
  return { d: v.endsWith('Z') ? new Date(Date.UTC(y, m, d, H, M, s)) : new Date(y, m, d, H, M, s), allDay: false };
}
function parseICS(text) {
  const out = []; let ev = null;
  const unesc = s => s.replace(/\\n/gi, '\n').replace(/\\([,;\\])/g, '$1');
  for (const l of text.replace(/\r?\n[ \t]/g, '').split(/\r?\n/)) {
    if (l === 'BEGIN:VEVENT') ev = { exdate: [] };
    else if (l === 'END:VEVENT') { if (ev?.start && ev.status !== 'CANCELLED') out.push(ev); ev = null; }
    else if (ev) {
      const i = l.indexOf(':'); if (i < 0) continue;
      const [name, ...params] = l.slice(0, i).split(';'), val = l.slice(i + 1);
      if (name === 'SUMMARY') ev.title = unesc(val);
      else if (name === 'DTSTART') ev.start = icsDate(val, params);
      else if (name === 'LOCATION') ev.loc = unesc(val);
      else if (name === 'UID') ev.uid = val;
      else if (name === 'STATUS') ev.status = val;
      else if (name === 'RRULE') ev.rrule = Object.fromEntries(val.split(';').map(p => p.split('=')));
      else if (name === 'EXDATE') val.split(',').forEach(x => ev.exdate.push(+icsDate(x, params).d));
      else if (name === 'RECURRENCE-ID') ev.recId = +icsDate(val, params).d;
    }
  }
  for (const o of out) if (o.recId) out.find(m => m.uid === o.uid && !m.recId)?.exdate.push(o.recId); // moved occurrences
  return out;
}
function expand(ev, from, to) { // occurrences of one event inside [from, to]
  const s = ev.start.d, res = [], add = d => { if (d >= from && d <= to && !ev.exdate.includes(+d)) res.push(d); };
  const r = ev.rrule; if (!r) { add(s); return res; }
  // ponytail: covers DAILY/WEEKLY(+BYDAY)/MONTHLY/YEARLY with INTERVAL/COUNT/UNTIL; "2nd Tuesday"-style rules repeat on the start's day of month
  const iv = +(r.INTERVAL || 1), until = r.UNTIL ? icsDate(r.UNTIL).d : to, count = +(r.COUNT || Infinity);

    if (r.FREQ === 'DAILY') b.setDate(s.getDate() + i * iv);
    else if (r.FREQ === 'WEEKLY') b.setDate(s.getDate() + i * 7 * iv);
    else if (r.FREQ === 'MONTHLY') b.setMonth(s.getMonth() + i * iv);
    else if (r.FREQ === 'YEARLY') b.setFullYear(s.getFullYear() + i * iv);
    else { add(s); break; }
    if (b > until || b > to) break;
    if (!days) { n++; add(b); continue; }
    const sun = new Date(b); sun.setDate(b.getDate() - b.getDay());
    for (const wd of days.sort()) { const d = new Date(sun); d.setDate(sun.getDate() + wd); if (d < s || d > until || n >= count) continue; n++; add(d); }
  }

}

const noteText = html => plain((html || '').replace(/<span[^>]*class="math"[^>]*>(<\/span>)?/g, m => { const t = m.match(/data-tex="([^"]*)"/)?.[1] || ''; return /data-display="1"/.test(m) ? ` $$${t}$$ ` : ` $${t}$ `; })).replace(/&quot;/g, '"');
function allCards() {
  const out = [], scan = (text, src) => { for (const m of (text + ' ').matchAll(/Q:\s*(.+?)\s*A:\s*(.+?)(?=\s*Q:|$)/gs)) out.push({ key: src + '|' + m[1].trim(), q: m[1].trim(), a: m[2].trim(), src }); };
  openNotes().forEach(n => scan(noteText(n.html), n.title || 'Untitled'));
  S.files.filter(f => f.type === 'md').forEach(f => scan(f.text.replace(/\s+/g, ' '), f.name));
  return out;
}

const HOME_DEFAULT = () => [Object.keys(WIDGETS).filter(id => WIDGETS[id].col === 0), Object.keys(WIDGETS).filter(id => WIDGETS[id].col === 1)];
function homeLayout() {
  const L = S.settings.home ||= { cols: HOME_DEFAULT() };
  L.collapsed ||= {}; L.hidden ||= {}; L.size ||= {};
  for (const id in WIDGETS) if (!L.cols.flat().includes(id)) L.cols[WIDGETS[id].col].push(id);
  return L;
}

function viewHome() {
  const h = new Date().getHours(), L = homeLayout(), made = {};
  main.innerHTML = `<div class="home"><div class="row" style="align-items:flex-start"><div style="flex:1"><h1>${h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'}</h1><p class="mut" style="margin:0">${new Date().toLocaleDateString(LOC, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</p></div>${window.native?.openWidget ? `<button class="btn" id="miniWin" title="A small always-on-top window with your tasks, today and the scratch pad">${icon('fit', 16)} Mini window</button>` : ''}<a class="btn" href="#/settings/widgets">${icon('settings', 16)} Customize</a></div>
    <div class="hcols">${L.cols.map((col, ci) => `<div class="hcol" data-col="${ci}">${col.filter(id => WIDGETS[id] && !L.hidden[id]).map(id => {
      const m = made[id] = WIDGETS[id].make();
      return `<div class="widget sz-${L.size[id] || 'fit'}${L.collapsed[id] ? ' shut' : ''}" data-w="${id}"><div class="wh"><span class="grip" draggable="true" title="Drag to move">⠿</span><button class="fold" title="Collapse / expand">${icon('down', 16)}</button><h3>${m.title}</h3>${m.tools || ''}</div><div class="wb">${m.body}</div></div>`;
    }).join('')}</div>`).join('')}</div></div>`;
  if ($('#miniWin')) $('#miniWin').onclick = () => window.native.openWidget();
  for (const id in made) made[id].bind?.(main.querySelector(`[data-w="${id}"]`));
  // drag a widget by its grip; it snaps into the slot under the cursor in either column
  let dragId = null; const ph = document.createElement('div'); ph.className = 'wph';
  main.querySelectorAll('.grip').forEach(g => g.ondragstart = e => {
    const w = g.closest('.widget'); dragId = w.dataset.w;
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.setDragImage(w, 24, 18);
    ph.style.height = Math.min(w.offsetHeight, 220) + 'px'; setTimeout(() => w.classList.add('dragging'));
  });
  main.ondragend = () => { dragId = null; ph.remove(); main.querySelectorAll('.dragging').forEach(w => w.classList.remove('dragging')); };
  main.querySelectorAll('.hcol').forEach(col => {
    col.ondragover = e => {
      if (!dragId) return; e.preventDefault();
      const next = [...col.querySelectorAll('.widget:not(.dragging)')].find(w => e.clientY < w.getBoundingClientRect().top + w.offsetHeight / 2);
      if (next) { if (ph.nextSibling !== next) col.insertBefore(ph, next); } else if (col.lastChild !== ph) col.append(ph);
    };
    col.ondrop = e => {
      e.preventDefault(); if (!dragId) return;
      const at = [...col.children].filter(c => c === ph || (c.dataset.w && c.dataset.w !== dragId)).indexOf(ph);
      L.cols.forEach(c => { const i = c.indexOf(dragId); if (i >= 0) c.splice(i, 1); });
      L.cols[+col.dataset.col].splice(at, 0, dragId); dragId = null; save(); viewHome();
    };
  });
  main.querySelectorAll('.fold').forEach(b => b.onclick = () => { const w = b.closest('.widget'), id = w.dataset.w; L.collapsed[id] = !L.collapsed[id]; w.classList.toggle('shut', L.collapsed[id]); save(); });
}

function safeHTML(html) { // markdown can carry raw HTML: drop scripts, embeds and inline handlers
  const d = new DOMParser().parseFromString(html, 'text/html');
  d.querySelectorAll('script,iframe,object,embed,style,link,meta,form').forEach(n => n.remove());
  d.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => { if (/^on/i.test(a.name) || /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name); }));
  return d.body.innerHTML;

/* ---------- math answers after "=" (like Apple Math Notes): in equations, and in notebook page text ---------- */
const TEXCMD = { cdot: '×', times: '×', ast: '×', div: '÷', pi: 'π', ln: 'ln', log: 'log', exp: 'exp', sin: 'sin', cos: 'cos', tan: 'tan', sinh: 'sinh', cosh: 'cosh', tanh: 'tanh',

function texToCalc(s) { // LaTeX (the usual school subset) -> calculator expression; throws on anything else

    ws(); if (s.startsWith('\\left', i)) i += 5;

function texAnswer(tex) { // equation ending in "=" -> answer text, or null
  if (S?.settings.mathEq === false) return null;
  const m = /^([\s\S]*[^=<>!\\])=\s*$/.exec((tex || '').trim()); if (!m) return null;
  const ex = m[1].slice(m[1].lastIndexOf('=') + 1); // "y = 2+3 =" answers 2+3

}
const ansTex = a => a.replace(/^(-?)(\d+)\/(\d+)$/, '$1\\frac{$2}{$3}').replace(/×10\^(-?\d+)/, '\\times10^{$1}');

function mathGhost(body, wrap) { // grey answer after "…=" at the caret; Tab / Enter / a tap types it in
  const g = Object.assign(document.createElement('span'), { className: 'mghost', title: 'Tab or Enter to keep the answer' }); g.dataset.noink = ''; g.hidden = true; wrap.append(g);
